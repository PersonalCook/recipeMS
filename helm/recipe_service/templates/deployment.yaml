apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "recipe_service.fullname" . }}
  labels:
    {{- include "recipe_service.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "recipe_service.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "recipe_service.selectorLabels" . | nindent 8 }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
    spec:
      containers:
        - name: recipe-service
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.service.targetPort }}
              protocol: TCP

          envFrom:
            - configMapRef:
                name: {{ include "recipe_service.fullname" . }}-config

          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.databaseUrlSecret.name }}
                  key: {{ .Values.secrets.databaseUrlSecret.key }}

            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.jwtSecret.name }}
                  key: {{ .Values.secrets.jwtSecret.key }}

            - name: ELASTICSEARCH_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.elasticPassword.name }}
                  key: {{ .Values.secrets.elasticPassword.key }}

            - name: NINJAS_NUTRITION_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.ninjasApiKey.name }}
                  key: {{ .Values.secrets.ninjasApiKey.key }}

          livenessProbe:
            httpGet:
              path: {{ .Values.probes.livenessPath }}
              port: {{ .Values.service.targetPort }}
            initialDelaySeconds: {{ .Values.probes.livenessInitialDelay }}
            periodSeconds: {{ .Values.probes.periodSeconds }}

          readinessProbe:
            httpGet:
              path: {{ .Values.probes.readinessPath }}
              port: {{ .Values.service.targetPort }}
            initialDelaySeconds: {{ .Values.probes.readinessInitialDelay }}
            periodSeconds: {{ .Values.probes.periodSeconds }}

          volumeMounts:
            - name: media
              mountPath: /app/media
            {{- if .Values.config.file.enabled }}
            - name: app-config
              mountPath: /app/config
              readOnly: true
            {{- end }}

      volumes:
        - name: media
          persistentVolumeClaim:
            claimName: {{ .Values.persistence.mediaPvcName }}
        {{- if .Values.config.file.enabled }}
        - name: app-config
          configMap:
            name: {{ include "recipe_service.fullname" . }}-config
            items:
              - key: {{ .Values.config.file.name }}
                path: {{ .Values.config.file.name }}
        {{- end }}
